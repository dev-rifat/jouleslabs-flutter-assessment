name: assessment
description: "A Flutter-based e-Signature mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Firebase
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.1

  # File & PDF Handling
  file_picker: ^8.1.7
  pdf: ^3.11.1
  printing: ^5.13.2
  syncfusion_flutter_pdfviewer: ^28.1.33
  path_provider: ^2.1.5
  
  # UI & Interactions
  signature: ^5.5.0
  intl: ^0.20.2
  uuid: ^4.5.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
